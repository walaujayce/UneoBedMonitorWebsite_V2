name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uneo_bed_monitor_website_v2:latest-dev .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uneo_bed_monitor_website_v2:latest-dev

      # -------------------------------
      # ✉️ 成功通知 Email
      # -------------------------------
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.uneotech.com
          server_port: 25
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD 成功 - develop branch build 成功"
          to: "jayce@uneotech.com"
          from: "GitHub Actions <${{ secrets.EMAIL_ADDRESS }}>"
          body: |
            Build Success!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      # -----------------------------------
      # 收集完整 workflow log（只在失敗時）
      # -----------------------------------
      - name: Collect logs
        if: failure()
        run: |
          mkdir logs
          dmesg > logs/system.log || true
          journalctl -xe > logs/journal.log || true
          cp $GITHUB_WORKSPACE/.github/workflows/*.yml logs/ 2>/dev/null || true

          # 將整個 job log 收集：
          echo "===== GitHub Job Log Begin =====" > logs/job.log
          RUNNER_TRACKING_ID=""  # 避免污染
          cat $GITHUB_STEP_SUMMARY >> logs/job.log 2>/dev/null || true
          echo "===== GitHub Job Log End =====" >> logs/job.log

          tar -czf logs.tar.gz logs

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failed-logs
          path: logs.tar.gz

      # -------------------------------
      # ✉️ 失敗通知 Email
      # -------------------------------
      - name: Download log artifact
        if: failure()
        uses: actions/download-artifact@v4
        with:
          name: build-failed-logs
          path: .

      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.uneotech.com
          server_port: 25
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ CI/CD 失敗 - develop branch build 失敗"
          to: "jayce@uneotech.com"
          from: "GitHub Actions <${{ secrets.EMAIL_ADDRESS }}>"
          body: |
            Build Failed!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

            已附上完整的工作流程 Log（logs.tar.gz）
          attachments: logs.tar.gz
