name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t p2211/uneo_bed_monitor_website_v2:${{ github.ref_name }} .
          docker tag p2211/uneo_bed_monitor_website_v2:${{ github.ref_name }} p2211/uneo_bed_monitor_website_v2:develop

          echo "COMMIT_TAG=${{ secrets.DOCKERHUB_USERNAME }} >> $GITHUB_OUTPUT
          echo "COMMIT_TAG=${{ secrets.DOCKERHUB_PASSWORD }} >> $GITHUB_OUTPUT
          echo "COMMIT_TAG=${{ github.ref_name }} >> $GITHUB_OUTPUT

      - name: Push Docker Image
        run: |
          docker push p2211/uneo_bed_monitor_website_v2:${{ github.ref_name }}
          docker push p2211/uneo_bed_monitor_website_v2:develop
