name: Build and Push Docker Image

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/uneo_bed_monitor_website_v2:latest-dev .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/uneo_bed_monitor_website_v2:latest-dev

      # -------------------------------
      # ✉️ 成功通知 Email
      # -------------------------------
      - name: Send success email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.uneotech.com
          server_port: 25
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI/CD 成功 - develop branch build 成功"
          to: "jayce@uneotech.com"
          from: "GitHub Actions <${{ secrets.EMAIL_ADDRESS }}>"
          body: |
            Build Success!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

      # -------------------------------
      # ✉️ 失敗通知 Email
      # -------------------------------
      - name: Send failure email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: mail.uneotech.com
          server_port: 25
          username: ${{ secrets.EMAIL_ADDRESS }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ CI/CD 失敗 - develop branch build 失敗"
          to: "jayce@uneotech.com"
          from: "GitHub Actions <${{ secrets.EMAIL_ADDRESS }}>"
          body: |
            Build Failed!
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
